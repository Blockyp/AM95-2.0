name: AM95 Tracker Scrape

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          DISCORD_WEBHOOK_PRICE_URL: ${{ secrets.DISCORD_WEBHOOK_PRICE_URL }}
          DISCORD_WEBHOOK_LISTINGS_URL: ${{ secrets.DISCORD_WEBHOOK_LISTINGS_URL }}
        run: python scraper.py

      - name: Commit updated data
        run: |
          git config user.name "am95-tracker-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Update tracker data [skip ci]"
          git push
